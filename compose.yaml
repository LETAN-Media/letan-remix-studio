services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: letan_remix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - letan_remix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d letan_remix"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  letan_remix_postgres:
